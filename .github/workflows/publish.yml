# Publishes the app to GitHub Pages every time changes are pushed to main.
# The commit id is stamped into sw.js, which is what makes installed apps show "New version available".
name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect app files and stamp the build id
        run: |
          mkdir _site
          cp -R index.html styles.css config.js manifest.webmanifest sw.js js icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js
          grep -q "${GITHUB_SHA::7}" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
