<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hydra Studio</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hydra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gated">
  <!-- Navigation bar: inline title fades in once the large title scrolls away (iOS behaviour) -->
  <header class="navbar">
    <div class="nav-start">
      <div class="nav-leading" id="nav-leading"></div>
      <span class="nav-logo wordmark" role="img" aria-label="Hydra"></span>
    </div>
    <div class="nav-title" id="nav-title"></div>
    <div class="nav-trailing">
      <!-- iOS 26: secondary toolbar items share one glass capsule; the primary action sits apart -->
      <div class="nav-glass">
        <span id="nav-actions"></span>
        <a id="settings-link" href="#/settings" class="nav-icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
      </div>
      <span id="nav-primary"></span>
    </div>
  </header>

  <main id="main">
    <h1 class="large-title" id="page-title"></h1>
    <div id="page"></div>
  </main>

  <!-- Tab bar: floating Liquid Glass capsule, filled symbols, one-word labels -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#/calendar" data-route="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2.5a1 1 0 0 1 1 1V5h8V3.5a1 1 0 1 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5V9H3V7.5A2.5 2.5 0 0 1 5.5 5H6V3.5a1 1 0 0 1 1-1zM3 10.5h18v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5z"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#/tasks" data-route="tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm4.7 6.3a1 1 0 0 0-1.4 0L10.5 13l-1.8-1.7a1 1 0 1 0-1.4 1.4l2.5 2.5a1 1 0 0 0 1.4 0l5.5-5.5a1 1 0 0 0 0-1.4z"/></svg>
      <span>Tasks</span>
    </a>
    <a href="#/sheets" data-route="sheets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M5.5 3A2.5 2.5 0 0 0 3 5.5v13A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5v-13A2.5 2.5 0 0 0 18.5 3zM9 9.5H19v4H9zm0 5.5H19v3.5a1 1 0 0 1-1 1H9zM5 9.5h2.5v4H5zm0 5.5h2.5v4.5H6a1 1 0 0 1-1-1z"/></svg>
      <span>Sheets</span>
    </a>
    <a href="#/visits" data-route="visits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.2 4h5.6a1.5 1.5 0 0 1 1.3.8L17 6.5h2.5A2.5 2.5 0 0 1 22 9v9.5a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5V9a2.5 2.5 0 0 1 2.5-2.5H7l.9-1.7A1.5 1.5 0 0 1 9.2 4zM12 17.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
      <span>Visits</span>
    </a>
    <a href="#/receipts" data-route="receipts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 2h12a1 1 0 0 1 1 1v18.2a.6.6 0 0 1-.9.5L15.5 20l-2.9 1.8a1 1 0 0 1-1.1 0L8.5 20l-2.6 1.7a.6.6 0 0 1-.9-.5V3a1 1 0 0 1 1-1zm3 5a.9.9 0 0 0 0 1.8h6a.9.9 0 0 0 0-1.8zm0 4a.9.9 0 0 0 0 1.8h6a.9.9 0 0 0 0-1.8zm0 4a.9.9 0 0 0 0 1.8h3.5a.9.9 0 0 0 0-1.8z"/></svg>
      <span>Receipts</span>
    </a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
